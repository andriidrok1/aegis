rules:
  - id: learned.aegis.sql-string-concat-3173d6f7e95b
    languages:
      - python
    severity: WARNING
    pattern: $CUR.execute("..." + $X + "...")
    message: "In app.py:26, the application retrieves the user input parameter 'q' from the query arguments. This input is then concatenated directly into a SQL query string in app.py:28 without validation or parameterization before being executed. This allows attackers to perform SQL Injection and read unauthorized records from the SQLite database. Learned by AEGIS from https://github.com/andriidrok1/aegis-demo-target/issues/70."
    metadata:
      cwe: CWE-89
      source_issue: https://github.com/andriidrok1/aegis-demo-target/issues/70
      source_repo: andriidrok1/aegis-demo-target
      learned_from_rule: aegis.sql-string-concat
      fingerprint: 3173d6f7e95b
      category: security
      aegis: learned